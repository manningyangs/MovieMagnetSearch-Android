# Project-wide Gradle settings.
# org.gradle.java.home=C:\\Users\\Home-pc\\.gradle\\jdks\\jdk17   # ← 本机 JDK 17 路径，不要提交
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

# ---- 网络超时 & 代理 ----
# 增加超时应对国内网络波动
systemProp.http.connectionTimeout=60000
systemProp.http.socketTimeout=60000
systemProp.https.connectionTimeout=60000
systemProp.https.socketTimeout=60000
systemProp.http.maxRedirects=5

# 如果需要走本地代理（如 Clash 默认 7890），取消注释下面两行
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7890
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7890

# Kotlin 扩展仓库镜像（可选，阿里云）
kotlin.repositories.gradle.org=https://maven.aliyun.com/repository/public/
